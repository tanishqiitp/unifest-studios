# Free Supabase projects pause after about a week without activity.
# This makes one tiny read every 3 days so the database stays awake.
name: Keep Supabase awake
on:
  schedule:
    - cron: '17 6 */3 * *'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the database
        env:
          # Public values: they are already in the web app.
          SUPABASE_URL: https://geagslcdzmniegzifzmp.supabase.co
          SUPABASE_KEY: sb_publishable_nFNAhTzBXqB6CjVhWyKeNw_0pVENlgo
        run: |
          curl -fsS -X POST "$SUPABASE_URL/rest/v1/rpc/get_share" \
            -H "apikey: $SUPABASE_KEY" -H "Content-Type: application/json" \
            -d '{"share_code":"keepawake01"}'
