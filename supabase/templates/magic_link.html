<!doctype html>
<html>
  <body style="margin:0;padding:0;background:#000;font-family:Inter,Segoe UI,Arial,sans-serif;color:#fff">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#000;padding:40px 16px">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:480px;background:#0b0b0b;border:1px solid #222;border-radius:16px;padding:32px">
            <tr>
              <td>
                <div style="display:inline-block;width:36px;height:36px;line-height:36px;text-align:center;background:#fff;color:#000;border-radius:9px;font-weight:700;font-size:20px">U</div>
                <span style="font-weight:700;font-size:15px;letter-spacing:.5px;margin-left:10px;vertical-align:middle">UNIFEST STUDIOS</span>
                <h1 style="font-size:22px;margin:28px 0 8px">Your sign-in link</h1>
                <p style="color:#a3a3a3;font-size:14px;line-height:1.6;margin:0 0 24px">Click the button to sign in to Unifest Studios. The link works once, in the browser where you asked for it, and expires in an hour.</p>
                <a href="{{ .ConfirmationURL }}" style="display:inline-block;background:#fff;color:#000;text-decoration:none;font-weight:600;font-size:14px;padding:12px 22px;border-radius:10px">Sign in</a>
                <p style="color:#6b6b6b;font-size:12px;line-height:1.6;margin:28px 0 0">If you didn't ask for this, you can ignore this email. Nobody can sign in without this link.</p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
